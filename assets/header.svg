<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160">
  <defs>
    <linearGradient id="qr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F6FEB"/><stop offset="100%" stop-color="#3FB950"/>
    </linearGradient>
  </defs>
  <rect width="720" height="160" fill="#0D1117"/>
  <!-- QR modules -->
  <g fill="url(#qr)">
    <rect x="40" y="30" width="50" height="50"><animate attributeName="opacity" values="1;0.35;1" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="100" y="30" width="18" height="18"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="128" y="30" width="18" height="18"/><rect x="156" y="30" width="18" height="18"><animate attributeName="opacity" values="1;0.3;1" dur="0.9s" repeatCount="indefinite"/></rect>
    <rect x="40" y="90" width="18" height="18"/><rect x="68" y="90" width="18" height="18"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="96" y="90" width="18" height="18"/><rect x="124" y="90" width="18" height="18"><animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/></rect>
    <rect x="152" y="90" width="18" height="18"/>
    <rect x="100" y="58" width="18" height="18"/><rect x="128" y="58" width="18" height="18"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="156" y="58" width="18" height="18"/>
  </g>
  <!-- scan line -->
  <rect x="36" y="20" width="140" height="3" fill="#3FB950" opacity="0.9">
    <animate attributeName="y" values="20;118;20" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <text x="220" y="70" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#E6EDF3">KSAS</text>
  <text x="220" y="100" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#8B949E">QR expires every 5s. Device bound. Screenshot useless.</text>
  <!-- countdown ring -->
  <g transform="translate(620,80)">
    <circle r="36" fill="none" stroke="#21262D" stroke-width="6"/>
    <circle r="36" fill="none" stroke="#1F6FEB" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="226" stroke-dashoffset="0" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" values="0;226;0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <text text-anchor="middle" dy="5" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#8B949E">5s</text>
  </g>
</svg>
